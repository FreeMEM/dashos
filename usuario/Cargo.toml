[package]
name = "dashos-usuario"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[features]
# El servicio de archivos (FS1): RedoxFS y el montón. La caja big-endian no lo compila.
archivos = ["monton", "dep:redoxfs", "dep:syscall"]
monton = ["dep:linked_list_allocator"]
# El compositor que habla Wayland y sus clientes de prueba (W7).
ventanas = ["monton", "dep:wayland", "dep:kit"]
# El servicio de sonido (S19, A4).
sonido = ["monton", "dep:sonido", "dep:audiodevice"]
# Las imágenes de disco del Amiga (S20): el servicio que monta un ADF.
imagenes = ["monton", "dep:amigados"]

[dependencies]
linked_list_allocator = { version = "0.10.6", default-features = false, optional = true }
redoxfs = { path = "../archivos/redoxfs", default-features = false, optional = true }
syscall = { package = "redox_syscall", version = "0.9.5", default-features = false, optional = true }
wayland = { package = "dashos-wayland", path = "../wayland", optional = true }
kit = { package = "dashos-kit", path = "../kit", optional = true }
sonido = { package = "dashos-sonido", path = "../sonido", optional = true }
audiodevice = { package = "dashos-audiodevice", path = "../audiodevice", optional = true }
amigados = { package = "dashos-amigados", path = "../amigados", optional = true }

[lib]
name = "dashos"
path = "src/lib.rs"
test = false

[[bin]]
name = "hola"
path = "src/bin/hola.rs"
test = false

[[bin]]
name = "serie"
path = "src/bin/serie.rs"
test = false

[[bin]]
name = "sd"
path = "src/bin/sd.rs"
test = false

[[bin]]
name = "fpu_a"
path = "src/bin/fpu_a.rs"
test = false

[[bin]]
name = "fpu_b"
path = "src/bin/fpu_b.rs"
test = false

[[bin]]
name = "malo"
path = "src/bin/malo.rs"
test = false

[profile.release]
panic = "abort"
opt-level = "s"
# Las dependencias (RedoxFS, seahash, lz4 del servicio de archivos), para ir rápido: con "s", crear un fichero costaba
# en DashOS cuatro veces lo que el mismo RedoxFS bajo QEMU en modo usuario (paso F10 de docs/MULTITAREA_LOOP.md).
[profile.release.package."*"]
opt-level = 3
[profile.dev]
panic = "abort"

