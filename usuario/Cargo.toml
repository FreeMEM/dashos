[package]
name = "dashos-usuario"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[features]
# El servicio de archivos (FS1): RedoxFS y el montón. La caja big-endian no lo compila.
archivos = ["monton", "dep:dashfs", "dep:syscall"]
monton = ["dep:linked_list_allocator"]
# El compositor que habla Wayland y sus clientes de prueba (W7).
ventanas = ["monton", "dep:wayland", "dep:kit"]
# El servicio de sonido (S19, A4).
sonido = ["monton", "dep:sonido", "dep:audiodevice"]
# Las imágenes de disco del Amiga (S20): el servicio que monta un ADF.
imagenes = ["monton", "dep:amigados"]
# El servicio de red (S13): la pila TCP/IP smoltcp (0BSD), solo con lo que usa.
red = ["monton", "dep:smoltcp"]
# La caja Linux (H9): los aparatos de la máquina virtual (virtio, PL011, distribuidor del GIC, PSCI, DTB).
caja = ["monton", "dep:caja-vmm"]
# El protocolo del Shell nativo (docs/bitacoras/shell-nativa.md), para quien lo lanza con argumentos (`guardian`).
# El Shell y sus órdenes están en `ordenes/`.
ordenes = ["dep:shell"]

[dependencies]
linked_list_allocator = { version = "0.10.6", default-features = false, optional = true }
dashfs = { path = "../archivos/dashfs", default-features = false, optional = true }
syscall = { package = "redox_syscall", version = "0.9.5", default-features = false, optional = true }
wayland = { package = "dashos-wayland", path = "../wayland", optional = true }
kit = { package = "dashos-kit", path = "../kit", optional = true }
sonido = { package = "dashos-sonido", path = "../sonido", optional = true }
audiodevice = { package = "dashos-audiodevice", path = "../audiodevice", optional = true }
amigados = { package = "dashos-amigados", path = "../amigados", optional = true }
caja-vmm = { package = "dashos-caja-vmm", path = "../caja-linux/vmm", optional = true }
shell = { package = "dashos-shell", path = "../shell", optional = true }
smoltcp = { version = "0.14.0", default-features = false, optional = true, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-ipv6", "proto-ipv6-slaac", "socket-tcp", "socket-tcp-reno", "socket-udp", "socket-dhcpv4", "iface-max-addr-count-4", "iface-max-route-count-4"] }

[lib]
name = "dashos"
path = "src/lib.rs"
test = false

[[bin]]
name = "hola"
path = "src/bin/hola.rs"
test = false

[[bin]]
name = "serie"
path = "src/bin/serie.rs"
test = false

[[bin]]
name = "sd"
path = "src/bin/sd.rs"
test = false

[[bin]]
name = "fpu_a"
path = "src/bin/fpu_a.rs"
test = false

[[bin]]
name = "fpu_b"
path = "src/bin/fpu_b.rs"
test = false

[[bin]]
name = "malo"
path = "src/bin/malo.rs"
test = false

[profile.release]
panic = "abort"
opt-level = "s"
# Sin tabla de símbolos: los programas van dentro de la imagen del kernel (el paquete de arranque de `inicio`) y nada
# la lee al cargarlos; con ella, la imagen pasaba de 9 MB.
strip = "symbols"
# Las dependencias (RedoxFS, seahash, lz4 del servicio de archivos), para ir rápido: con "s", crear un fichero costaba
# en DashOS cuatro veces lo que el mismo RedoxFS bajo QEMU en modo usuario (paso F10 de docs/MULTITAREA_LOOP.md).
[profile.release.package."*"]
opt-level = 3
[profile.dev]
panic = "abort"

