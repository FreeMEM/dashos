[package]
name = "dashos-usuario"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[lib]
name = "dashos"
path = "src/lib.rs"
test = false

[[bin]]
name = "hola"
path = "src/bin/hola.rs"
test = false

[[bin]]
name = "serie"
path = "src/bin/serie.rs"
test = false

[[bin]]
name = "sd"
path = "src/bin/sd.rs"
test = false

[[bin]]
name = "fpu_a"
path = "src/bin/fpu_a.rs"
test = false

[[bin]]
name = "fpu_b"
path = "src/bin/fpu_b.rs"
test = false

[[bin]]
name = "malo"
path = "src/bin/malo.rs"
test = false

[profile.release]
panic = "abort"
opt-level = "s"
[profile.dev]
panic = "abort"

[[bin]]
name = "tenis"
path = "src/bin/tenis.rs"
test = false

[[bin]]
name = "repartos"
path = "src/bin/repartos.rs"
test = false
