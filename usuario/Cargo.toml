[package]
name = "dashos-usuario"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[lib]
name = "dashos"
path = "src/lib.rs"
test = false

[[bin]]
name = "hola"
path = "src/bin/hola.rs"
test = false

[[bin]]
name = "serie"
path = "src/bin/serie.rs"
test = false

[[bin]]
name = "sd"
path = "src/bin/sd.rs"
test = false

[profile.release]
panic = "abort"
opt-level = "s"
[profile.dev]
panic = "abort"
