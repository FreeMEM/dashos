[build]
# Lo nativo de DashOS es little-endian (C30). Los programas de la caja Amiga van en big-endian:
# cargo build --target aarch64_be-unknown-none-softfloat.
target = "aarch64-unknown-none-softfloat"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "link-arg=-Tenlace.ld", "-C", "relocation-model=static"]

[target.aarch64_be-unknown-none-softfloat]
rustflags = ["-C", "link-arg=-Tenlace.ld", "-C", "relocation-model=static"]
