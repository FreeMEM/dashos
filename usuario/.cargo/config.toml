[build]
# Lo nativo de DashOS es little-endian (C30). Los programas de la caja Amiga van en big-endian:
# cargo build --target aarch64_be-unknown-none-softfloat.
target = "aarch64-unknown-none-softfloat"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "link-arg=-Tenlace.ld", "-C", "relocation-model=static"]

[target.aarch64_be-unknown-none-softfloat]
rustflags = ["-C", "link-arg=-Tenlace.ld", "-C", "relocation-model=static"]

# x86-64 (S21, X4): sin SSE, como el kernel (la FPU se usa con ensamblador); en direcciones fijas por debajo de 2 GB.
# Sin RELRO: si no, la GOT va en un segmento aparte que comparte página con .bss, y el cargador lo rechaza.
[target.x86_64-unknown-none]
rustflags = ["-C", "link-arg=-Tenlace.ld", "-C", "link-arg=-znorelro", "-C", "relocation-model=static", "-C", "code-model=small"]
