[package]
name = "redoxfs"
description = "The Redox Filesystem"
repository = "https://gitlab.redox-os.org/redox-os/redoxfs"
version = "0.9.1"
license-file = "LICENSE"
readme = "README.md"
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
edition = "2024"

[lib]
name = "redoxfs"
path = "src/lib.rs"

[[bin]]
name = "redoxfs"
path = "src/bin/mount.rs"
doc = false
required-features = ["std"]

[[bin]]
name = "redoxfs-ar"
path = "src/bin/ar.rs"
doc = false
required-features = ["std"]

[[bin]]
name = "redoxfs-clone"
path = "src/bin/clone.rs"
doc = false
required-features = ["std"]

[[bin]]
name = "redoxfs-fsck"
path = "src/bin/fsck.rs"
doc = false
required-features = ["std"]

[[bin]]
name = "redoxfs-volume"
path = "src/bin/volume.rs"
doc = false
required-features = ["std"]

[[bin]]
name = "redoxfs-snapshot"
path = "src/bin/snapshot.rs"
doc = false
required-features = ["std"]

[[bin]]
name = "redoxfs-mkfs"
path = "src/bin/mkfs.rs"
doc = false
required-features = ["std"]

[[bin]]
name = "redoxfs-resize"
path = "src/bin/resize.rs"
doc = false
required-features = ["std"]

[dependencies]
aes = { version = "0.8", default-features = false }
argon2 = { version = "0.4", default-features = false, features = ["alloc"] }
base64ct = { version = "1", default-features = false }
bitflags = "2"
chacha20 = { version = "0.9", default-features = false }
endian-num = "0.1"
env_logger = { version = "0.11", optional = true, default-features = false }
getrandom = { version = "0.4", optional = true }
humansize = { version = "2", optional = true }
libc = "0.2"
log = { version = "0.4.14", default-features = false, optional = true }
lz4_flex = { version = "0.11", default-features = false, features = ["checked-decode"] }
parse-size = { version = "1", optional = true }
poly1305 = "0.8"
range-tree = { version = "0.1.1", optional = true }
redox_syscall = "0.9.5"
seahash = { version = "4.1.0", default-features = false }
siphasher = { version = "1", default-features = false }
smallvec = { version = "1.15.2", optional = true }
termion = { version = "4", optional = true }
uuid = { version = "1.4", default-features = false }
xts-mode = { version = "0.5", default-features = false }
zerocopy = "0.8.55"

[features]
default = ["std", "log", "fuse"]
fuse = [
    "fuser",
    "std",
]
std = [
    "env_logger",
    "getrandom",
    "humansize",
    "libredox",
    "parse-size",
    "range-tree",
    "termion",
    "uuid/v4",
    "redox_syscall/std",
    "redox-scheme",
    "smallvec",
]

[target.'cfg(not(target_os = "redox"))'.dependencies]
fuser = { version = "0.16", optional = true }

[target.'cfg(target_os = "redox")'.dependencies]
redox-rings = { git = "https://gitlab.redox-os.org/redox-os/redox-rings.git", features = ["userspace", "sync"] }
libredox = { version = "0.1.20", optional = true }
redox-path = "0.4.1"
redox-scheme = { version = "0.12", optional = true }
redox-buffer-pool = { git = "https://gitlab.redox-os.org/redox-os/redox-buffer-pool.git" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dev-dependencies]
assert_cmd = "2.0.17"
