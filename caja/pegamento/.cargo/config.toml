# La caja Amiga es big-endian, como el 68k. Se enlaza con el C de la caja (../Makefile), así que sin `mem` de
# compiler_builtins: memcpy, memset y memmove son los de Emu68 (src/support.c), y memcmp y bcmp los de caja.c.
[build]
target = "aarch64_be-unknown-none-softfloat"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]

# X7: la caja de x86 (make -C caja ARQ=x86_64), con --target x86_64-unknown-none.
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=pie"]

[target.aarch64_be-unknown-none-softfloat]
# PIE: la caja es un PIE estático, por encima de 4 GB (../enlace.ld).
rustflags = ["-C", "relocation-model=pie"]

# U7: la caja en little-endian (make -C caja ORDEN=le).
[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "relocation-model=pie"]
