[package]
name = "dashos-caja-pegamento"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "El pegamento de la caja Amiga: exec, dos, graphics e intuition (crates de caja/) enchufadas en el proceso de la caja, con la memoria del 68k, el servicio de archivos y el compositor de DashOS"

[lib]
name = "caja_pegamento"
path = "src/lib.rs"
crate-type = ["staticlib"]
test = false

[dependencies]
caja_exec = { package = "dashos-caja-exec", path = "../exec" }
caja_dos = { package = "dashos-caja-dos", path = "../dos" }
caja_intuition = { package = "dashos-caja-intuition", path = "../intuition" }
caja_utility = { package = "dashos-caja-utility", path = "../utility" }
caja_timer = { package = "dashos-caja-timer", path = "../timer" }
dashos = { package = "dashos-usuario", path = "../../usuario", default-features = false }
wayland = { package = "dashos-wayland", path = "../../wayland" }
# S26: el esquema de Material 3 del tema de DashOS (las plumas de los programas Amiga "como DashOS").
kit = { package = "dashos-kit", path = "../../kit" }

# X7: en x86 el 68k lo ejecuta RelevoJIT (su interfaz de C, include/relevo.h, la usa ../motor_relevo.c). La caja
# necesita su rama `motor-caja` (f74486e: entrada anidada y base 0). `make -C caja x86 RELEVO_DIR=<ruta>` usa un clon
# local en su lugar.
[target.'cfg(target_arch = "x86_64")'.dependencies]
relevo = { git = "https://github.com/FreeMEM/RelevoJIT", rev = "f74486e", default-features = false }

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
lto = true
debug = false

[profile.dev]
panic = "abort"
