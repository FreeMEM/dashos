[package]
name = "dashos-kernel"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[[bin]]
name = "dashos-kernel"
test = false
bench = false

[features]
# Las pruebas del arranque y lo que solo usan ellas (C36). `make prueba` las pone; `make` no.
pruebas = []

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
debug = true
