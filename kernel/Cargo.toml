[package]
name = "dashos-kernel"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[[bin]]
name = "dashos-kernel"
test = false
bench = false

[features]
# Las pruebas del arranque y lo que solo usan ellas (C36). `make prueba` las pone; `make` no.
pruebas = []
# QEMU virt por UEFI (U3, docs/UEFI_LOOP.md): otra dirección de carga, otro mapa de aparatos, PSCI.
virt = []
# Con `virt`: cuatro programas que ocupan los cuatro núcleos mientras suena el sonido (S19, A6; `make sonido-carga`).
carga = []

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
debug = true
