[package]
name = "dashos-kernel"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"

[[bin]]
name = "dashos-kernel"
test = false
bench = false

[features]
# Las pruebas del arranque y lo que solo usan ellas (C36). `make prueba` las pone; `make` no.
pruebas = []
# QEMU virt por UEFI (U3, docs/UEFI_LOOP.md): otra dirección de carga, otro mapa de aparatos, PSCI.
virt = []
# La Raspberry Pi 3 (P3, docs/MULTITAREA_LOOP.md): periféricos en 0x3F000000 y el controlador de interrupciones de la
# BCM2836 (QA7) en lugar del GIC. Sin `virt`.
pi3 = []
# La Raspberry Pi 5 (docs/bitacoras/pi5.md): la imagen que carga su firmware (kernel_2712.img), periféricos de la BCM2712
# por encima de 64 GB, el UART10 de depuración. Lleva el diagnóstico en pantalla.
pi5 = ["diagnostico"]
# La consola del kernel en la pantalla del firmware (buzón de la VideoCore o `simple-framebuffer` del árbol) con el
# diagnóstico del primer arranque en una placa nueva, y solo la consola y la caja Amiga como programas
# (`make pi5`, `make arranque-virt-diag`).
diagnostico = []
# Con `diagnostico`: el escritorio en la pantalla del firmware, sin GPU ni teclado (la Pi 5, paso 4 de
# docs/bitacoras/pi5.md): el compositor, dos ventanas de prueba, Ajustes y la caja Amiga con su ventana. El kernel pinta su
# diagnóstico hasta que da la pantalla al compositor.
escritorio = ["diagnostico"]
# Con `virt`: cuatro programas que ocupan los cuatro núcleos mientras suena el sonido (S19, A6; `make sonido-carga`).
carga = []
# Con `virt`: audio.device nativo en lugar de los dos tonos (S19, fase 2; `make sonido-paula`).
paula = []
# El banco de medidas de la multitarea (M0, docs/MULTITAREA_LOOP.md; `make medir`): solo `consola` y `medir`, con
# el paquete de los hijos de prueba.
medir = []
# Con `medir`: experimento, no seguro (M9). La tabla vacía conserva el ASID: cuánto pesa en QEMU vaciar la TLB.
medir_asid = []
# Con `virt`: el banco del sistema de archivos (paso F; `make medir-fs`): solo consola, nvme, archivos y `medir-fs`.
medir_fs = []
# Con `virt`: la caja Linux (H9) arranca un kernel de Linux de verdad (`make arranque-virt-linux`): su Image, que no va
# en git, entra en el paquete de arranque desde target/linux/Image y llega a `caja-linux` como datos.
linux = []

# El build.rs comprime los programas del paquete de arranque (LZ4, formato de bloque); el kernel no depende de nada.
[build-dependencies]
lz4_flex = "0.11"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
debug = true
