[build]
target = "aarch64-unknown-none-softfloat"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.aarch64-unknown-none-softfloat]
# La MMU se enciende en arranque.s antes de entrar en Rust, así que no hace falta strict-align (C6).
# El guion de enlace lo elige build.rs: enlace.ld (la Pi) o enlace_virt.ld (QEMU virt, característica "virt").
rustflags = ["-C", "force-frame-pointers=yes"]
